<html lang="en-GB">

<style>
/* Classic currency-list layout: every currency on one screen, tap one to type, the rest follow. Deliberately one dark look. */
:root{
  --bg:#0A1626; --bar:#0E1D31; --row:#12243B; --row-alt:#10213A; --base:#173A5C;
  --ink:#F1F6FB; --muted:#8EA3BA; --line:#1D3350;
  --accent:#4FC3F7; --accent-ink:#04131F; --sun:#FFC94A; --sun-ink:#2A1E00; --warn:#F2B45A; --danger:#FF7A7A;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:16px;padding-block:10px 12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.right{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);
  background:var(--bar);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD69B}
.status.old .dot{background:var(--warn)}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--bar);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap;color:var(--muted)}
.link .dot{width:9px;height:9px;background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
.link.live{color:#3DD69B}
.link.live .dot{background:#3DD69B;box-shadow:0 0 0 0 rgba(61,214,155,.6);animation:glow 2.4s ease-out infinite}
.link.down{color:var(--danger)}
.link.down .dot{background:var(--danger);box-shadow:0 0 8px rgba(255,122,122,.8);animation:none}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,214,155,.6)}70%{box-shadow:0 0 0 7px rgba(61,214,155,0)}100%{box-shadow:0 0 0 0 rgba(61,214,155,0)}}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:360px){.brand{font-size:19px}.status,.link{padding-inline:8px}}
.edit{border:0;background:none;color:var(--accent);font:600 15px var(--body);padding:6px 4px;cursor:pointer}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:var(--row);cursor:pointer;position:relative;transition:background .15s}
.row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row:nth-child(even){background:var(--row-alt)}
.row.shift{transition:transform .18s ease}
.row.lifted{z-index:5;background:var(--base);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px var(--accent);border-radius:12px;transition:box-shadow .15s,border-radius .15s}
.dragging .list{overflow:hidden}
.row:active{background:var(--base)}
.row.is-base{background:var(--base)}
.row.is-base::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.flag{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;line-height:1;flex-shrink:0}
.who{min-width:0;flex-shrink:0;width:7.6em}
/* gold: permanent first row */
.flag.au{background:radial-gradient(circle at 32% 28%,#FFF1B8 0,#F5C542 38%,#B8860B 100%);color:#4A3200;
  font:700 15px/1 var(--display);letter-spacing:.02em;box-shadow:inset 0 -2px 4px rgba(90,60,0,.35)}
.row.gold .code{color:#F5C542}
.row.gold .words{white-space:normal}
.gchips{display:flex;gap:5px;margin-top:3px}
.gchip{border:1px solid rgba(245,197,66,.45);background:rgba(245,197,66,.10);color:#F5C542;font:700 11px/1 var(--body);
  padding:4px 7px;border-radius:999px;cursor:pointer;white-space:nowrap}
.gchip:active{background:rgba(245,197,66,.28)}
.gunit{font-size:.55em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.code{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em}
.name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{flex:1;min-width:0;text-align:right}
.amt{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt.s{font-size:21px}.amt.xs{font-size:17px}
.is-base .amt{color:var(--accent)}
.typing .is-base .amt::after{content:"";display:inline-block;width:2px;height:.85em;margin-left:2px;vertical-align:-.08em;
  background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sel{background:rgba(79,195,247,.28);border-radius:6px;padding:0 3px;color:var(--ink)}
.words{font-size:12.5px;font-weight:600;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate b{color:var(--ink);font-weight:600}
.remove{border:0;background:var(--danger);color:#2A0606;width:26px;height:26px;border-radius:50%;font:700 18px/1 var(--body);
  cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.add{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--accent);
  font:600 15px var(--body);padding:16px;cursor:pointer;text-align:left}
.add i{width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--accent);display:grid;place-items:center;font-style:normal;font-size:22px}
.foot{font-size:11px;color:var(--muted);padding:4px 16px 16px}

.dock{background:var(--bar);border-top:1px solid var(--line);padding-inline:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.flip{width:100%;border:0;border-radius:18px;background:var(--sun);color:var(--sun-ink);min-height:58px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;
  transition:transform .1s ease}
.flip:active{transform:scale(.98)}
.flip svg{width:22px;height:22px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.flipped .flip svg{transform:rotate(180deg)}

.pad{display:grid;grid-template-columns:repeat(3,1fr) .62fr .62fr;gap:8px}
.key.unit{background:var(--base);color:var(--accent);font-weight:700;font-size:19px;line-height:1;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.key.unit small{font:600 9.5px var(--body);color:var(--muted)}
.u-l{grid-column:4;grid-row:1}.u-c{grid-column:5;grid-row:1}.u-m{grid-column:4;grid-row:2}.u-b{grid-column:5;grid-row:2}
.rate.hint{color:var(--warn);white-space:normal}
.key.done{grid-column:4/6;grid-row:3/5;height:auto;background:var(--accent);color:var(--accent-ink);font:700 17px var(--display);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 18px rgba(79,195,247,.28)}
.key.done svg{width:26px;height:26px}
.key.done:active{background:#7DD3FA}
.padtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.padtop span{font-size:13px;color:var(--muted)}
.padtop span b{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--row);color:var(--ink);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.key{border:0;border-radius:14px;background:var(--row);color:var(--ink);font-family:var(--display);font-weight:500;font-size:24px;
  height:52px;cursor:pointer;display:grid;place-items:center;user-select:none;-webkit-user-select:none;transition:transform .08s ease,background .15s}
.key:active{transform:scale(.95);background:var(--base)}
.key.fn{background:transparent;color:var(--muted)}
.key svg{width:24px;height:24px}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.scrim{position:fixed;inset:0;background:rgba(0,6,14,.6);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:var(--bar);
  border-radius:22px 22px 0 0;height:80%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-title{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:16px var(--body)}
.search:focus{outline:2px solid var(--accent);border-color:transparent}
.picks{overflow-y:auto;flex:1;padding:6px 8px 16px}
.pick{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:10px;border-radius:12px;cursor:pointer;text-align:left}
.pick:active{background:var(--base)}
.pick .flag{width:36px;height:36px;font-size:21px}
.pick .c{font-family:var(--display);font-weight:700;font-size:17px;width:3.2em}
.pick .n{color:var(--muted);font-size:14px;flex:1;min-width:0}
.empty{padding:24px 10px;color:var(--muted);text-align:center}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Flip<span>.</span></div>
    <div class="right">
      <div class="link" id="link" role="status" aria-live="polite"><i class="dot"></i><span id="linkText">Linking</span></div>
      <div class="status" id="status"><i class="dot"></i><span id="statusText">Saved rates</span></div>
      <button class="edit" id="editBtn">Edit</button>
    </div>
  </header>

  <div class="list" id="list" role="list"></div>

  <div class="dock" id="dock">
    <button class="flip" id="flip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>
      <span id="flipLabel">Flip rates</span>
    </button>
    <div id="keys" hidden>
      <div class="padtop"><button class="chip" id="clear">Clear</button><span>Typing in <b id="typingCode"></b></span></div>
      <div class="pad" id="pad">
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="." aria-label="Decimal point">.</button>
        <button class="key" data-k="0">0</button>
        <button class="key unit u-l" data-k="l" aria-label="Lakh">L<small>Lakh</small></button>
        <button class="key unit u-c" data-k="c" aria-label="Crore">C<small>Crore</small></button>
        <button class="key unit u-m" data-k="m" aria-label="Million">M<small>Million</small></button>
        <button class="key unit u-b" data-k="b" aria-label="Billion">B<small>Billion</small></button>
        <button class="key done" id="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</button>
        <button class="key fn" data-k="B" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9 6 6m0-6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <div class="grab"></div>
    <div class="sheet-title"><span id="sheetTitle">Add a currency</span><button class="chip" id="closeSheet">Done</button></div>
    <input class="search" id="search" type="search" placeholder="Search, e.g. yen or THB" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="picks" id="picks"></div>
</div>
<script>
// Built-in rates (per 1 USD, open.er-api.com, 4 Nov 2026). Used only until newer rates arrive.
const BUILT_IN={updated:"2026-11-04T00:02:31Z",rates:{AED:3.6725,ARS:1549.7194,AUD:1.434205,BDT:124.496963,BGN:1.747547,BHD:0.376,BRL:5.48609,CAD:1.399422,CHF:0.820009,CLP:978.112665,CNY:6.684036,COP:3221.311219,CZK:21.757265,DKK:6.680451,EGP:55.370618,EUR:0.893426,GBP:0.745418,GEL:2.595476,HKD:7.845778,HUF:325.892843,IDR:18140.247665,ILS:3.164114,INR:94.834253,ISK:121.706697,JOD:0.709,JPY:158.39919,KES:129.975909,KRW:1343.930997,KWD:0.311167,LKR:332.444906,MAD:9.822838,MXN:18.737449,MYR:4.076971,NGN:1346.069771,NOK:9.280833,NZD:1.783786,OMR:0.384497,PEN:3.464766,PHP:63.519923,PKR:276.527777,PLN:3.945126,QAR:3.64,RON:4.772099,RUB:81.415956,SAR:3.75,SEK:9.79114,SGD:1.281123,THB:33.757532,TRY:50.042701,TWD:32.770816,UAH:45.680667,USD:1,VND:25769.065289,ZAR:16.617144}};

const CUR={USD:["US dollar","US"],EUR:["Euro","EU"],GBP:["British pound","GB"],JPY:["Japanese yen","JP"],CHF:["Swiss franc","CH"],CAD:["Canadian dollar","CA"],AUD:["Australian dollar","AU"],NZD:["New Zealand dollar","NZ"],CNY:["Chinese yuan","CN"],HKD:["Hong Kong dollar","HK"],SGD:["Singapore dollar","SG"],INR:["Indian rupee","IN"],PKR:["Pakistani rupee","PK"],BDT:["Bangladeshi taka","BD"],LKR:["Sri Lankan rupee","LK"],AED:["UAE dirham","AE"],SAR:["Saudi riyal","SA"],QAR:["Qatari riyal","QA"],KWD:["Kuwaiti dinar","KW"],BHD:["Bahraini dinar","BH"],OMR:["Omani rial","OM"],TRY:["Turkish lira","TR"],EGP:["Egyptian pound","EG"],MAD:["Moroccan dirham","MA"],ZAR:["South African rand","ZA"],NGN:["Nigerian naira","NG"],KES:["Kenyan shilling","KE"],THB:["Thai baht","TH"],MYR:["Malaysian ringgit","MY"],IDR:["Indonesian rupiah","ID"],PHP:["Philippine peso","PH"],VND:["Vietnamese dong","VN"],KRW:["South Korean won","KR"],TWD:["New Taiwan dollar","TW"],SEK:["Swedish krona","SE"],NOK:["Norwegian krone","NO"],DKK:["Danish krone","DK"],PLN:["Polish złoty","PL"],CZK:["Czech koruna","CZ"],HUF:["Hungarian forint","HU"],RON:["Romanian leu","RO"],BGN:["Bulgarian lev","BG"],ISK:["Icelandic króna","IS"],MXN:["Mexican peso","MX"],BRL:["Brazilian real","BR"],ARS:["Argentine peso","AR"],CLP:["Chilean peso","CL"],COP:["Colombian peso","CO"],PEN:["Peruvian sol","PE"],ILS:["Israeli shekel","IL"],JOD:["Jordanian dinar","JO"],RUB:["Russian rouble","RU"],UAH:["Ukrainian hryvnia","UA"],GEL:["Georgian lari","GE"]};
const DEFAULT_LIST=["GBP","USD","EUR","CNY","PKR","AED","SAR","MAD","INR"];

const store={get(k){try{return JSON.parse(localStorage.getItem("flip."+k))}catch(e){return null}},
             set(k,v){try{localStorage.setItem("flip."+k,JSON.stringify(v))}catch(e){}}};

let rates=store.get("rates");
if(!rates||!rates.rates||new Date(rates.updated)<new Date(BUILT_IN.updated))rates=BUILT_IN;
if(!rates.rates.USD)rates=BUILT_IN;
const saved=store.get("list")||{};
let list=Array.isArray(saved.list)?saved.list.filter(c=>rates.rates[c]):DEFAULT_LIST.slice();
if(!list.length)list=DEFAULT_LIST.slice();
let base=(saved.base==="GOLD"||list.includes(saved.base))?saved.base:list[0];
let input=typeof saved.input==="string"?saved.input:"1";
let inverse=!!saved.inv2;
let typing=false, editing=false, fresh=false;

const $=id=>document.getElementById(id);
let regionNames=null,curNames=null;
try{regionNames=new Intl.DisplayNames(["en-GB"],{type:"region"});curNames=new Intl.DisplayNames(["en-GB"],{type:"currency"});}catch(e){}
function nameOf(c){
  if(CUR[c])return CUR[c][0];
  try{const n=curNames&&curNames.of(c);if(n&&n!==c)return n.charAt(0).toUpperCase()+n.slice(1);}catch(e){}
  return c;
}
function flagOf(c){
  let r=CUR[c]?CUR[c][1]:null;
  if(!r&&c[0]!=="X"){const cand=c.slice(0,2);try{if(regionNames&&regionNames.of(cand)!==cand)r=cand;}catch(e){}}
  return r?r.replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0))):"🌐";
}
// Gold is a permanent row. Its "rate" depends on the weight unit and karat chosen on the row.
// [saved key, chip text, grams, what one unit is called in the rate line, suffix after the amount]
const G_UNITS=[["tola","Tola",11.6638038,"1 tola","tola"],["10g","10 g",10,"10 g","× 10 g"],["g","1 g",1,"1 g","g"],["oz","Ounce",31.1034768,"1 oz","oz"]];
const G_KARATS=[24,22,21,18];
const BUILT_IN_GOLD={usdOz:4048,at:"2026-11-10T22:10:00Z"}; // spot, 10 Nov 2026
let gold=store.get("goldPrice");
if(!gold||!(gold.usdOz>0)||new Date(gold.at)<new Date(BUILT_IN_GOLD.at))gold=BUILT_IN_GOLD;
const gs=store.get("goldSet")||{};
let gUnit=G_UNITS.findIndex(u=>u[0]===gs.unit);if(gUnit<0)gUnit=0;
let gKarat=G_KARATS.indexOf(gs.karat);if(gKarat<0)gKarat=0;
const goldGrams=()=>G_UNITS[gUnit][2];
const goldLabel=()=>G_UNITS[gUnit][4];
// how much gold (in the chosen unit and karat) 1 US dollar buys
const goldPerUsd=()=>1/(gold.usdOz/31.1034768*goldGrams()*(G_KARATS[gKarat]/24));
const R=c=>c==="GOLD"?goldPerUsd():rates.rates[c];
const save=()=>{store.set("list",{list,base,input,inv2:inverse});store.set("goldSet",{unit:G_UNITS[gUnit][0],karat:G_KARATS[gKarat]});};
const rateOf=(a,b)=>R(b)/R(a);
// Rupees use South Asian grouping (1,00,000) and lakh/crore wording
const WORDS={INR:[[1e7,"crore"],[1e5,"lakh"],[1e3,"thousand"]],
             PKR:[[1e11,"kharab"],[1e9,"arab"],[1e7,"crore"],[1e5,"lakh"],[1e3,"thousand"]]};
const SOUTH_ASIAN={INR:1,PKR:1};
const nf=(o,c)=>new Intl.NumberFormat(c&&SOUTH_ASIAN[c]?"en-IN":"en-GB",o);
// Other currencies: 43,323,542 -> "43.3 million"
const BIG=[[1e12,"trillion"],[1e9,"billion"],[1e6,"million"]];
function bigWords(n){
  if(!isFinite(n)||n<1e6)return "";
  for(let i=0;i<BIG.length;i++){
    const [v,w]=BIG[i];
    if(n>=v){
      let x=Math.round(n/v*10)/10;
      // 999.96 million rounds to 1,000 million: show 1 billion instead
      if(x>=1000&&i>0)return new Intl.NumberFormat("en-GB",{maximumFractionDigits:1}).format(Math.round(n/BIG[i-1][0]*10)/10)+" "+BIG[i-1][1];
      return new Intl.NumberFormat("en-GB",{maximumFractionDigits:1}).format(x)+" "+w;
    }
  }
  return "";
}
// Gold weights the way jewellers say them: 1 tola = 12 masha = 96 ratti = 11.6638 g
function fmtGrams(g){
  if(g>=1000)return nf({maximumFractionDigits:2}).format(g/1000)+" kg";
  return nf({minimumFractionDigits:g<10?2:1,maximumFractionDigits:2}).format(g)+" g";
}
function tolaWords(t){
  const total=t*96;                                // in ratti
  if(total<8)return nf({maximumFractionDigits:1}).format(total)+" ratti";
  const r=Math.round(total), T=Math.floor(r/96), M=Math.floor((r%96)/8), R=r%8;
  return [T&&T+" tola",M&&M+" masha",R&&R+" ratti"].filter(Boolean).join(" ");
}
function goldWords(n){
  if(!isFinite(n)||n<=0)return "";
  const g=n*goldGrams(), key=G_UNITS[gUnit][0];
  if(key==="tola")return tolaWords(n)+" · "+fmtGrams(g);
  if(key==="g")return "";                         // already in grams
  return fmtGrams(g);                              // ounces and 10 g packs
}
function words(n,c){
  if(c==="GOLD")return goldWords(n);
  const steps=WORDS[c];
  if(!steps)return bigWords(n);
  if(!isFinite(n)||n<1000)return "";
  // largest two units, e.g. 36 crore 92 lakh
  let r=Math.floor(n);const parts=[];
  for(const [v,w] of steps){
    if(r>=v){const q=Math.floor(r/v);r-=q*v;parts.push(new Intl.NumberFormat("en-IN").format(q)+" "+w);if(parts.length===2)break;}
  }
  return parts.join(" ");
}

function fmtResult(n,c){
  if(!isFinite(n))return "–";
  if(n===0)return "0.00";
  if(n>=1)return nf({minimumFractionDigits:2,maximumFractionDigits:2},c).format(n);
  return nf({maximumSignificantDigits:4},c).format(n);
}
// Amounts can use units: L (lakh), C (crore), M (million), B (billion).
// e.g. 1.7M = 1,700,000 · 1C50L = 1 crore 50 lakh. A number must come between units,
// lakh/crore can't mix with million/billion, and a second unit must be the smaller one.
const UNIT={L:1e5,C:1e7,M:1e6,B:1e9};
const FAMILY={L:"sa",C:"sa",M:"w",B:"w"};
const UNAME={L:"lakh",C:"crore",M:"million",B:"billion"};
const norm=s=>String(s||"").replace(/\s+/g,"").toUpperCase().replace(/[^0-9.LCMB]/g,"");
const segsOf=s=>norm(s).match(/[0-9.]*[LCMB]|[0-9.]+$/g)||[];
const parseAmt=s=>{let v=0;for(const g of segsOf(s)){const u=/[LCMB]$/.test(g)?g.slice(-1):"";v+=Number((u?g.slice(0,-1):g)||0)*(UNIT[u]||1);}return isFinite(v)?v:0;};
const hasUnits=s=>/[LCMB]/.test(norm(s));
function fmtInput(s,c){
  const segs=segsOf(s);
  if(!segs.length)return "0";
  return segs.map(g=>{
    const u=/[LCMB]$/.test(g)?g.slice(-1):"";const num=u?g.slice(0,-1):g;
    const [i,d]=num.split(".");
    return nf({maximumFractionDigits:0},c).format(Number(i||0))+(d!==undefined?"."+d:"")+u;
  }).join(" ");
}
let hint="",hintT=0;
function nope(msg){hint=msg;clearTimeout(hintT);hintT=setTimeout(()=>{hint="";render();},2200);render();}
const fmtRate=r=>nf({maximumSignificantDigits:5}).format(r);
const fmtMoney=(v,c)=>nf(v>=1000?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2},c).format(v);
const sizeClass=t=>"amt"+(t.length>14?" xs":t.length>11?" s":"");

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

function render(){
  document.body.classList.toggle("typing",typing);
  $("app").classList.toggle("flipped",inverse);
  $("editBtn").textContent=editing?"Done":"Edit";
  $("flipLabel").textContent=inverse?"Show standard rates":"Flip rates";
  const L=$("list");L.innerHTML="";
  const amount=parseAmt(input);
  const hasUnit=hasUnits(input);
  ["GOLD",...list].forEach(c=>{
    const isBase=c===base, isGold=c==="GOLD";
    const row=el("div","row"+(isBase?" is-base":"")+(isGold?" gold":""));
    row.dataset.c=c;row.setAttribute("role","listitem");row.tabIndex=0;
    if(editing&&!isGold){
      const x=el("button","remove","−");x.dataset.remove=c;x.setAttribute("aria-label","Remove "+c);row.append(x);
    }
    const f=isGold?el("span","flag au","Au"):el("span","flag",flagOf(c));
    const who=el("div","who");
    if(isGold){
      const chips=el("div","gchips");
      const u=el("button","gchip",G_UNITS[gUnit][1]);u.dataset.gunit="1";u.setAttribute("aria-label","Change gold weight, now "+G_UNITS[gUnit][1]);
      const k=el("button","gchip",G_KARATS[gKarat]+"K");k.dataset.gkarat="1";k.setAttribute("aria-label","Change gold purity, now "+G_KARATS[gKarat]+" karat");
      chips.append(u,k);who.append(el("div","code","Gold"),chips);
    }else who.append(el("div","code",c),el("div","name",nameOf(c)));
    const val=el("div","val");
    const text=isBase?fmtInput(input,c):fmtResult(amount*rateOf(base,c),c);
    const amtEl=el("div",sizeClass(text));
    if(isBase&&typing&&fresh){const sel=el("span","sel",text);amtEl.append(sel);}else amtEl.textContent=text;
    if(isGold)amtEl.append(el("span","gunit",goldLabel()));
    val.append(amtEl);
    {const w=words(isBase?amount:amount*rateOf(base,c),c);if(w)val.append(el("div","words",w));}
    let rl;
    if(isBase&&hint)rl=hint;
    else if(isBase&&hasUnit)rl="= "+fmtResult(amount,c)+" "+c;
    else if(isBase)rl=typing?(fresh?"Type a new amount":"Type an amount"):"Tap any row to convert from it";
    else{
      // show the rate the readable way round: 1 of the stronger currency = n of the other
      // e.g. typing in PKR, the GBP row reads "1 GBP = 370.97 PKR". Flip turns them all round.
      const r=rateOf(c,base);
      const big=(r>=1)!==inverse;
      const one=x=>x==="GOLD"?G_UNITS[gUnit][3]+" "+G_KARATS[gKarat]+"K":"1 "+x;
      const unitOf=x=>x==="GOLD"?goldLabel():x;
      // gold prices read as whole money amounts, e.g. 1 tola 24K = 4,19,762 PKR
      const num=(v,cur)=>(c==="GOLD"||base==="GOLD")&&cur!=="GOLD"?fmtMoney(v,cur):fmtRate(v);
      rl=big?[one(c)+" = ",num(r,base)," "+unitOf(base)]:[one(base)+" = ",num(1/r,c)," "+unitOf(c)];
    }
    const rateEl=el("div","rate"+(isBase&&hint?" hint":""));
    if(Array.isArray(rl)){rateEl.append(document.createTextNode(rl[0]),el("b",null,rl[1]),document.createTextNode(rl[2]));}
    else rateEl.textContent=rl;
    val.append(rateEl);
    row.append(f,who,val);
    L.append(row);
  });
  const add=el("button","add");add.id="addBtn";
  const plus=el("i",null,"+");add.append(plus,document.createTextNode("Add a currency"));
  L.append(add);
  const ga=new Date(gold.at);
  const gWhen=ga.toDateString()===new Date().toDateString()?ga.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):ga.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  L.append(el("div","foot","Gold is the international spot price (updated "+gWhen+"). 1 tola = 11.66 g = 12 masha = 96 ratti. Tap Tola or 24K on the gold row to change weight or purity. Jewellers add making charges and local premiums, so shop prices are higher."));
  L.append(el("div","foot","Hold a currency and drag it to reorder. Mid-market rates for guidance; banks and bureaux add their own margin."));
  $("typingCode").textContent=base;
  $("flip").hidden=typing;$("keys").hidden=!typing;
  renderStatus();
}
function renderStatus(){
  const d=new Date(rates.updated);
  const ageH=(Date.now()-d)/36e5;
  const day=d.toDateString()===new Date().toDateString()?"today":
    new Date(Date.now()-864e5).toDateString()===d.toDateString()?"yesterday":
    d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  $("statusText").textContent=ageH<=48?"Latest rates":"Rates from "+day;
  $("status").classList.toggle("old",ageH>48);
  $("status").title="Last updated "+d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}

function selectRow(c){
  if(c!==base){
    // keep the same money value when switching the row you type in
    const v=parseAmt(input)*rateOf(base,c);
    input=v?String(c==="GOLD"?Math.round(v*1000)/1000:Math.round(v*100)/100):"";
    base=c;
  }
  typing=true;fresh=true;save();render();
  const r=document.querySelector('.row[data-c="'+c+'"]');if(r)r.scrollIntoView({block:"nearest"});
}
// hold-and-drag reordering
const LIST=$("list");
let hold=null, drag=null, suppressClick=false, lastTouch=0;
function startPress(row,y){
  cancelPress();
  hold={row,y,timer:setTimeout(()=>lift(row,y),380)};
}
function cancelPress(){if(hold){clearTimeout(hold.timer);hold=null;}}
function lift(row,y){
  hold=null;
  const rows=[...LIST.querySelectorAll(".row:not(.gold)")];
  const from=rows.indexOf(row);
  if(from<0)return;
  drag={row,rows,from,to:from,startY:y,y,startScroll:LIST.scrollTop,h:row.offsetHeight,top:row.offsetTop,
        mids:rows.map(r=>r.offsetTop+r.offsetHeight/2)};
  rows.forEach(r=>{if(r!==row)r.classList.add("shift");});
  row.classList.add("lifted");document.body.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  moveDrag();
  drag.raf=requestAnimationFrame(autoScroll);
}
function moveDrag(){
  const d=drag;if(!d)return;
  const dy=d.y-d.startY+(LIST.scrollTop-d.startScroll);
  d.row.style.transform="translateY("+dy+"px) scale(1.03)";
  const centre=d.top+d.h/2+dy;
  let to=0;d.mids.forEach((m,i)=>{if(i!==d.from&&m<centre)to++;});
  d.to=to;
  d.rows.forEach((r,j)=>{
    if(j===d.from)return;
    const t=(d.from<j&&j<=to)?-d.h:(to<=j&&j<d.from)?d.h:0;
    r.style.transform=t?"translateY("+t+"px)":"";
  });
}
function autoScroll(){
  if(!drag)return;
  const b=LIST.getBoundingClientRect();
  const v=drag.y<b.top+60?-7:drag.y>b.bottom-60?7:0;
  if(v){const before=LIST.scrollTop;LIST.scrollTop+=v;if(LIST.scrollTop!==before)moveDrag();}
  drag.raf=requestAnimationFrame(autoScroll);
}
function drop(){
  cancelPress();
  if(!drag)return;
  cancelAnimationFrame(drag.raf);
  const {from,to}=drag;
  drag=null;document.body.classList.remove("dragging");
  if(to!==from){const [c]=list.splice(from,1);list.splice(to,0,c);save();}
  suppressClick=true;setTimeout(()=>{suppressClick=false;},450);
  render();
}
LIST.addEventListener("touchstart",e=>{
  lastTouch=Date.now();
  const row=e.target.closest(".row");
  if(!row||row.classList.contains("gold")||e.target.closest("[data-remove]")||e.touches.length>1){cancelPress();return;}
  startPress(row,e.touches[0].clientY);
},{passive:true});
document.addEventListener("touchmove",e=>{
  lastTouch=Date.now();
  const y=e.touches[0].clientY;
  if(drag){e.preventDefault();drag.y=y;moveDrag();}
  else if(hold&&Math.abs(y-hold.y)>8)cancelPress();
},{passive:false});
document.addEventListener("touchend",()=>{lastTouch=Date.now();drop();});
document.addEventListener("touchcancel",()=>{lastTouch=Date.now();drop();});
LIST.addEventListener("mousedown",e=>{
  if(Date.now()-lastTouch<800||e.button!==0)return;
  const row=e.target.closest(".row");
  if(row&&!row.classList.contains("gold")&&!e.target.closest("[data-remove]"))startPress(row,e.clientY);
});
document.addEventListener("mousemove",e=>{
  if(Date.now()-lastTouch<800)return;
  if(drag){drag.y=e.clientY;moveDrag();}
  else if(hold&&Math.abs(e.clientY-hold.y)>6)cancelPress();
});
document.addEventListener("mouseup",()=>{if(Date.now()-lastTouch<800)return;drop();});
LIST.addEventListener("contextmenu",e=>{if(e.target.closest(".row"))e.preventDefault();});

$("list").addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();return;}
  if(e.target.closest("[data-gunit]")){gUnit=(gUnit+1)%G_UNITS.length;save();render();return;}
  if(e.target.closest("[data-gkarat]")){gKarat=(gKarat+1)%G_KARATS.length;save();render();return;}
  const rm=e.target.closest("[data-remove]");
  if(rm){
    if(list.length<=2)return;
    list=list.filter(x=>x!==rm.dataset.remove);
    if(!list.includes(base))base=list[0];
    save();render();return;
  }
  if(e.target.closest("#addBtn")){openSheet();return;}
  const row=e.target.closest(".row");
  if(row&&!editing)selectRow(row.dataset.c);
});
$("list").addEventListener("keydown",e=>{
  const row=e.target.closest(".row");
  if(e.target.closest(".gchip"))return;
  if(row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(!editing)selectRow(row.dataset.c);}
});

function press(k){
  const unit="lcmb".includes(k)&&k.length===1;
  // first key after tapping a currency replaces the old amount
  if(fresh&&k!=="B"&&k!=="C"&&(!unit||hasUnits(input)))input="";
  fresh=false;
  input=norm(input);
  const cut=Math.max(...[..."LCMB"].map(u=>input.lastIndexOf(u)));
  const head=input.slice(0,cut+1), tail=input.slice(cut+1);
  const prev=cut>=0?input[cut]:"";
  if(k==="C")input="";
  else if(k==="B")input=input.slice(0,-1);
  else if(unit){
    const U=k.toUpperCase();
    if(prev&&tail==="")return nope("Type a number before adding another unit");
    if(prev&&FAMILY[prev]!==FAMILY[U])return nope("Lakh and crore can't be mixed with million and billion");
    if(prev&&UNIT[U]>=UNIT[prev])return nope("After "+UNAME[prev]+" you can only add a smaller unit");
    if(tail===".")return nope("Type a number first");
    input=head+(tail.replace(/\.$/,"")||"1")+U;
  }
  else if(k==="."){if(!tail.includes("."))input=head+(tail||"0")+".";}
  else{
    if(tail.replace(/[^0-9]/g,"").length>=11)return;
    if(tail.includes(".")&&tail.split(".")[1].length>=(base==="GOLD"?3:2))return;
    input=head+((tail==="0")?k:tail+k);
  }
  hint="";save();render();
}
$("pad").addEventListener("click",e=>{const b=e.target.closest(".key");if(b&&b.dataset.k)press(b.dataset.k);});
$("clear").addEventListener("click",()=>press("C"));
$("done").addEventListener("click",()=>{typing=false;render();});
document.addEventListener("keydown",e=>{
  if(!$("sheet").hidden){if(e.key==="Escape")closeSheet();return;}
  if(!typing)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="."||e.key===",")press(".");
  else if(e.key==="Backspace")press("B");
  else if(/^[lcmb]$/i.test(e.key))press(e.key.toLowerCase());
  else if(e.key===" ")e.preventDefault(); // spaces are ignored, e.g. "1.7 m"
  else if(e.key==="Escape"||e.key==="Enter"){typing=false;render();}
});

$("flip").addEventListener("click",()=>{inverse=!inverse;save();render();});
$("editBtn").addEventListener("click",()=>{editing=!editing;typing=false;render();});

// add-currency sheet
function openSheet(){
  $("search").value="";buildPicks("");
  $("scrim").hidden=false;$("sheet").hidden=false;$("picks").scrollTop=0;
}
function closeSheet(){$("scrim").hidden=true;$("sheet").hidden=true;}
function buildPicks(q){
  const P=$("picks");P.innerHTML="";
  q=q.trim().toLowerCase();
  const avail=Object.keys(rates.rates).filter(c=>!list.includes(c))
    .filter(c=>!q||c.toLowerCase().includes(q)||nameOf(c).toLowerCase().includes(q))
    .sort((a,b)=>q?((b.toLowerCase().startsWith(q))-(a.toLowerCase().startsWith(q))||a.localeCompare(b)):a.localeCompare(b));
  if(!avail.length){P.append(el("div","empty",q?"No currency matches “"+q+"”. Try a code like USD or a name like dollar.":"Every currency is already on your list."));return;}
  avail.forEach(c=>{
    const b=el("button","pick");b.dataset.c=c;
    b.append(el("span","flag",flagOf(c)),el("span","c",c),el("span","n",nameOf(c)));
    P.append(b);
  });
}
$("search").addEventListener("input",e=>buildPicks(e.target.value));
$("picks").addEventListener("click",e=>{
  const b=e.target.closest(".pick");if(!b)return;
  list.push(b.dataset.c);save();render();closeSheet();
});
$("closeSheet").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);

render();

// Rates come straight from open.er-api.com (free, no key, updated daily). The last good set is kept on the phone.
const RATES_URL="https://open.er-api.com/v6/latest/USD";
let nextUpdate=Number(store.get("next"))||0, lastFetch=0;
function takeRates(d){
  if(!d||!d.rates||!d.updated||!d.rates.USD)return;
  if(new Date(d.updated)>=new Date(rates.updated)){
    rates={updated:d.updated,rates:d.rates};
    store.set("rates",rates);
    if(!drag)render();
  }
}
// Connection light: green when the internet answers, red when it doesn't.
function setLink(state){
  const L=$("link");
  L.classList.toggle("live",state==="live");L.classList.toggle("down",state==="down");
  $("linkText").textContent=state==="live"?"Live":state==="down"?"Offline":"Linking";
  L.title=state==="live"?"Connected. Checked "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):
          state==="down"?"No connection. Showing your saved rates.":"Connecting…";
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
async function fetchRates(){
  lastFetch=Date.now();
  const r=await withTimeout(fetch(RATES_URL,{cache:"no-store"}),8000);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(j.result!=="success"||!j.rates)throw new Error("bad data");
  nextUpdate=(j.time_next_update_unix||0)*1000;store.set("next",nextUpdate);
  takeRates({updated:new Date(j.time_last_update_unix*1000).toISOString(),rates:j.rates});
}
// Gold spot price: xaus.com (free, no key, updates continuously). Backup: daily figure from the currency-api feed.
const GOLD_URL="https://xaus.com/api/v1/spot?compact=1";
const GOLD_BACKUP="https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json";
let lastGold=0;
function takeGold(usdOz,at){
  if(!(usdOz>500&&usdOz<50000))return;          // ignore anything implausible
  if(new Date(at)<new Date(gold.at))return;
  gold={usdOz,at};store.set("goldPrice",gold);
  if(!drag)render();
}
async function fetchGold(){
  lastGold=Date.now();
  try{
    const r=await withTimeout(fetch(GOLD_URL,{cache:"no-store"}),8000);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const p=Number(j.spot_usd_oz||(j.xau&&j.xau.unit==="oz"&&j.xau.currency==="USD"&&j.xau.price));
    const at=j.price_as_of||j.updated_at||new Date().toISOString();
    if(!(p>0))throw new Error("bad data");
    takeGold(p,new Date(at).toISOString());
  }catch(e){
    const r=await withTimeout(fetch(GOLD_BACKUP,{cache:"no-store"}),8000);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const x=j&&j.usd&&Number(j.usd.xau);
    if(!(x>0))throw new Error("bad data");
    takeGold(1/x,new Date((j.date||"")+"T00:00:00Z").toISOString());
  }
}
async function ping(){
  const r=await withTimeout(fetch("ping.txt?t="+Date.now(),{cache:"no-store"}),6000);
  if(!r.ok)throw new Error("HTTP "+r.status);
}
let checking=false;
async function check(force){
  renderStatus();
  if(document.hidden||checking)return;
  if(!navigator.onLine){setLink("down");return;}
  checking=true;
  try{
    // only download rates when the feed has published new ones (and not more than every 10 minutes)
    const due=force||rates===BUILT_IN||Date.now()>=nextUpdate;
    // gold moves all day, so refresh it every 5 minutes while the app is open
    const goldDue=force||Date.now()-lastGold>300000;
    let ok=false;
    if(goldDue){try{await fetchGold();ok=true;}catch(e){}}
    if(due&&Date.now()-lastFetch>(force?0:600000)){
      try{await fetchRates();ok=true;}catch(e){}
    }
    if(!ok)await ping();
    setLink("live");
  }catch(e){setLink("down");}
  finally{checking=false;}
}
check(true);                                   // once when you open the app
setInterval(()=>check(false),60000);           // every minute while it's open
document.addEventListener("visibilitychange",()=>{if(!document.hidden)check(false);});
window.addEventListener("offline",()=>setLink("down"));
window.addEventListener("online",()=>check(true));
if(!navigator.onLine)setLink("down");

// works offline once installed
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

// optional visitor counting (GoatCounter). Fill in GOATCOUNTER_CODE at the top of this file.
if(window.GOATCOUNTER_CODE){
  const g=document.createElement("script");g.async=true;g.src="https://gc.zgo.at/count.js";
  g.dataset.goatcounter="https://"+window.GOATCOUNTER_CODE+".goatcounter.com/count";
  document.body.appendChild(g);
}
