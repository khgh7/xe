<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flip Currency</title>
<meta name="theme-color" content="#0A1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Classic currency-list layout: every currency on one screen, tap one to type, the rest follow. Deliberately one dark look. */
:root{
  --bg:#0A1626; --bar:#0E1D31; --row:#12243B; --row-alt:#10213A; --base:#173A5C;
  --ink:#F1F6FB; --muted:#8EA3BA; --line:#1D3350;
  --accent:#4FC3F7; --accent-ink:#04131F; --sun:#FFC94A; --sun-ink:#2A1E00; --warn:#F2B45A; --danger:#FF7A7A;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:16px;padding-block:10px 12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.right{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);
  background:var(--bar);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD69B}
.status.old .dot{background:var(--warn)}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--bar);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap;color:var(--muted)}
.link .dot{width:9px;height:9px;background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
.link.live{color:#3DD69B}
.link.live .dot{background:#3DD69B;box-shadow:0 0 0 0 rgba(61,214,155,.6);animation:glow 2.4s ease-out infinite}
.link.down{color:var(--danger)}
.link.down .dot{background:var(--danger);box-shadow:0 0 8px rgba(255,122,122,.8);animation:none}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,214,155,.6)}70%{box-shadow:0 0 0 7px rgba(61,214,155,0)}100%{box-shadow:0 0 0 0 rgba(61,214,155,0)}}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:360px){.brand{font-size:19px}.status,.link{padding-inline:8px}}
.edit{border:0;background:none;color:var(--accent);font:600 15px var(--body);padding:6px 4px;cursor:pointer}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:var(--row);cursor:pointer;position:relative;transition:background .15s}
.row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row:nth-child(even){background:var(--row-alt)}
.row.shift{transition:transform .18s ease}
.row.lifted{z-index:5;background:var(--base);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px var(--accent);border-radius:12px;transition:box-shadow .15s,border-radius .15s}
.dragging .list{overflow:hidden}
.row:active{background:var(--base)}
.row.is-base{background:var(--base)}
.row.is-base::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.flag{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;line-height:1;flex-shrink:0}
.who{min-width:0;flex-shrink:0;width:7.6em}
.code{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em}
.name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{flex:1;min-width:0;text-align:right}
.amt{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt.s{font-size:21px}.amt.xs{font-size:17px}
.is-base .amt{color:var(--accent)}
.typing .is-base .amt::after{content:"";display:inline-block;width:2px;height:.85em;margin-left:2px;vertical-align:-.08em;
  background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sel{background:rgba(79,195,247,.28);border-radius:6px;padding:0 3px;color:var(--ink)}
.rate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remove{border:0;background:var(--danger);color:#2A0606;width:26px;height:26px;border-radius:50%;font:700 18px/1 var(--body);
  cursor:pointer;flex-shrink:0;display:grid;place-items:center}
.add{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--accent);
  font:600 15px var(--body);padding:16px;cursor:pointer;text-align:left}
.add i{width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--accent);display:grid;place-items:center;font-style:normal;font-size:22px}
.foot{font-size:11px;color:var(--muted);padding:4px 16px 16px}

.dock{background:var(--bar);border-top:1px solid var(--line);padding-inline:16px;padding-block:12px 12px}
.flip{width:100%;border:0;border-radius:18px;background:var(--sun);color:var(--sun-ink);min-height:58px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;
  transition:transform .1s ease}
.flip:active{transform:scale(.98)}
.flip svg{width:22px;height:22px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.flipped .flip svg{transform:rotate(180deg)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.padtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.padtop span{font-size:13px;color:var(--muted)}
.padtop span b{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--row);color:var(--ink);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.key{border:0;border-radius:14px;background:var(--row);color:var(--ink);font-family:var(--display);font-weight:500;font-size:24px;
  height:52px;cursor:pointer;display:grid;place-items:center;user-select:none;-webkit-user-select:none;transition:transform .08s ease,background .15s}
.key:active{transform:scale(.95);background:var(--base)}
.key.fn{background:transparent;color:var(--muted)}
.key svg{width:24px;height:24px}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.scrim{position:fixed;inset:0;background:rgba(0,6,14,.6);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:var(--bar);
  border-radius:22px 22px 0 0;height:80%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-title{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:16px var(--body)}
.search:focus{outline:2px solid var(--accent);border-color:transparent}
.picks{overflow-y:auto;flex:1;padding:6px 8px 16px}
.pick{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:10px;border-radius:12px;cursor:pointer;text-align:left}
.pick:active{background:var(--base)}
.pick .flag{width:36px;height:36px;font-size:21px}
.pick .c{font-family:var(--display);font-weight:700;font-size:17px;width:3.2em}
.pick .n{color:var(--muted);font-size:14px;flex:1;min-width:0}
.empty{padding:24px 10px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Flip<span>.</span></div>
    <div class="right">
      <div class="link" id="link" role="status" aria-live="polite"><i class="dot"></i><span id="linkText">Linking</span></div>
      <div class="status" id="status"><i class="dot"></i><span id="statusText">Saved rates</span></div>
      <button class="edit" id="editBtn">Edit</button>
    </div>
  </header>

  <div class="list" id="list" role="list"></div>

  <div class="dock" id="dock">
    <button class="flip" id="flip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>
      <span id="flipLabel">Flip rates</span>
    </button>
    <div id="keys" hidden>
      <div class="padtop"><button class="chip" id="clear">Clear</button><span>Typing in <b id="typingCode"></b></span><button class="chip go" id="done">Done</button></div>
      <div class="pad" id="pad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key" data-k="." aria-label="Decimal point">.</button>
        <button class="key" data-k="0">0</button>
        <button class="key fn" data-k="B" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9 6 6m0-6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <div class="grab"></div>
    <div class="sheet-title"><span id="sheetTitle">Add a currency</span><button class="chip" id="closeSheet">Done</button></div>
    <input class="search" id="search" type="search" placeholder="Search, e.g. yen or THB" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="picks" id="picks"></div>
</div>

<script>
// Built-in rates (per 1 USD, open.er-api.com, 19 Oct 2026). Used only until newer rates arrive.
const BUILT_IN={updated:"2026-10-19T00:02:32Z",rates:{USD:1,EUR:0.890861,GBP:0.750306,JPY:157.911394,CHF:0.824293,CAD:1.41317,AUD:1.435811,NZD:1.768993,CNY:6.69274,HKD:7.848103,SGD:1.279456,INR:95.184915,PKR:276.755441,BDT:123.400189,LKR:330.890582,AED:3.6725,SAR:3.75,QAR:3.64,KWD:0.309747,BHD:0.376,OMR:0.384497,TRY:49.543961,EGP:53.524668,MAD:9.726552,ZAR:16.461903,NGN:1331.61657,KES:129.78817,THB:33.419704,MYR:4.081565,IDR:18052.884411,PHP:63.065741,VND:25869.403572,KRW:1333.598991,TWD:32.446228,SEK:9.91606,NOK:9.435805,DKK:6.647974,PLN:3.893647,CZK:21.677301,HUF:323.526082,RON:4.738261,BGN:1.742369,ISK:121.015354,MXN:18.457069,BRL:5.072543,ARS:1514.5655,CLP:981.666438,COP:3174.489272,PEN:3.436238,ILS:3.109192,JOD:0.709,RUB:83.208148,UAH:44.860486,GEL:2.597015}};

const CUR={USD:["US dollar","US"],EUR:["Euro","EU"],GBP:["British pound","GB"],JPY:["Japanese yen","JP"],CHF:["Swiss franc","CH"],CAD:["Canadian dollar","CA"],AUD:["Australian dollar","AU"],NZD:["New Zealand dollar","NZ"],CNY:["Chinese yuan","CN"],HKD:["Hong Kong dollar","HK"],SGD:["Singapore dollar","SG"],INR:["Indian rupee","IN"],PKR:["Pakistani rupee","PK"],BDT:["Bangladeshi taka","BD"],LKR:["Sri Lankan rupee","LK"],AED:["UAE dirham","AE"],SAR:["Saudi riyal","SA"],QAR:["Qatari riyal","QA"],KWD:["Kuwaiti dinar","KW"],BHD:["Bahraini dinar","BH"],OMR:["Omani rial","OM"],TRY:["Turkish lira","TR"],EGP:["Egyptian pound","EG"],MAD:["Moroccan dirham","MA"],ZAR:["South African rand","ZA"],NGN:["Nigerian naira","NG"],KES:["Kenyan shilling","KE"],THB:["Thai baht","TH"],MYR:["Malaysian ringgit","MY"],IDR:["Indonesian rupiah","ID"],PHP:["Philippine peso","PH"],VND:["Vietnamese dong","VN"],KRW:["South Korean won","KR"],TWD:["New Taiwan dollar","TW"],SEK:["Swedish krona","SE"],NOK:["Norwegian krone","NO"],DKK:["Danish krone","DK"],PLN:["Polish złoty","PL"],CZK:["Czech koruna","CZ"],HUF:["Hungarian forint","HU"],RON:["Romanian leu","RO"],BGN:["Bulgarian lev","BG"],ISK:["Icelandic króna","IS"],MXN:["Mexican peso","MX"],BRL:["Brazilian real","BR"],ARS:["Argentine peso","AR"],CLP:["Chilean peso","CL"],COP:["Colombian peso","CO"],PEN:["Peruvian sol","PE"],ILS:["Israeli shekel","IL"],JOD:["Jordanian dinar","JO"],RUB:["Russian rouble","RU"],UAH:["Ukrainian hryvnia","UA"],GEL:["Georgian lari","GE"]};
const DEFAULT_LIST=["GBP","USD","EUR","CNY","PKR","AED","SAR","MAD","INR"];

const store={get(k){try{return JSON.parse(localStorage.getItem("flip."+k))}catch(e){return null}},
             set(k,v){try{localStorage.setItem("flip."+k,JSON.stringify(v))}catch(e){}}};

let rates=store.get("rates");
if(!rates||!rates.rates||new Date(rates.updated)<new Date(BUILT_IN.updated))rates=BUILT_IN;
const saved=store.get("list")||{};
let list=Array.isArray(saved.list)?saved.list.filter(c=>CUR[c]):DEFAULT_LIST.slice();
if(!list.length)list=DEFAULT_LIST.slice();
let base=list.includes(saved.base)?saved.base:list[0];
let input=typeof saved.input==="string"?saved.input:"1";
let inverse=!!saved.inverse;
let typing=false, editing=false, fresh=false;

const $=id=>document.getElementById(id);
const flagOf=c=>CUR[c][1].replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));
const save=()=>store.set("list",{list,base,input,inverse});
const rateOf=(a,b)=>rates.rates[b]/rates.rates[a];
const nf=(o)=>new Intl.NumberFormat("en-GB",o);

function fmtResult(n){
  if(!isFinite(n))return "–";
  if(n===0)return "0.00";
  if(n>=1)return nf({minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
  return nf({maximumSignificantDigits:4}).format(n);
}
function fmtInput(s){
  if(s==="")return "0";
  const [i,d]=s.split(".");
  return nf({maximumFractionDigits:0}).format(Number(i||0))+(d!==undefined?"."+d:"");
}
const fmtRate=r=>nf({maximumSignificantDigits:5}).format(r);
const sizeClass=t=>"amt"+(t.length>14?" xs":t.length>11?" s":"");

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

function render(){
  document.body.classList.toggle("typing",typing);
  $("app").classList.toggle("flipped",inverse);
  $("editBtn").textContent=editing?"Done":"Edit";
  $("flipLabel").textContent=inverse?"Show rates per "+base:"Flip rates";
  const L=$("list");L.innerHTML="";
  const amount=Number(input||0);
  list.forEach(c=>{
    const isBase=c===base;
    const row=el("div","row"+(isBase?" is-base":""));
    row.dataset.c=c;row.setAttribute("role","listitem");row.tabIndex=0;
    if(editing){
      const x=el("button","remove","−");x.dataset.remove=c;x.setAttribute("aria-label","Remove "+c);row.append(x);
    }
    const f=el("span","flag",flagOf(c));
    const who=el("div","who");who.append(el("div","code",c),el("div","name",CUR[c][0]));
    const val=el("div","val");
    const text=isBase?fmtInput(input):fmtResult(amount*rateOf(base,c));
    const amtEl=el("div",sizeClass(text));
    if(isBase&&typing&&fresh){const sel=el("span","sel",text);amtEl.append(sel);}else amtEl.textContent=text;
    val.append(amtEl);
    let rl;
    if(isBase)rl=typing?(fresh?"Type a new amount":"Type an amount"):"Tap any row to convert from it";
    else rl=inverse?"1 "+c+" = "+fmtRate(rateOf(c,base))+" "+base:"1 "+base+" = "+fmtRate(rateOf(base,c))+" "+c;
    val.append(el("div","rate",rl));
    row.append(f,who,val);
    L.append(row);
  });
  const add=el("button","add");add.id="addBtn";
  const plus=el("i",null,"+");add.append(plus,document.createTextNode("Add a currency"));
  L.append(add);
  L.append(el("div","foot","Hold a currency and drag it to reorder. Mid-market rates for guidance; banks and bureaux add their own margin."));
  $("typingCode").textContent=base;
  $("flip").hidden=typing;$("keys").hidden=!typing;
  renderStatus();
}
function renderStatus(){
  const d=new Date(rates.updated);
  const ageH=(Date.now()-d)/36e5;
  const day=d.toDateString()===new Date().toDateString()?"today":
    new Date(Date.now()-864e5).toDateString()===d.toDateString()?"yesterday":
    d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  $("statusText").textContent=ageH<=48?"Latest rates":"Rates from "+day;
  $("status").classList.toggle("old",ageH>48);
  $("status").title="Last updated "+d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
}

function selectRow(c){
  if(c!==base){
    // keep the same money value when switching the row you type in
    const v=Number(input||0)*rateOf(base,c);
    input=v?String(Math.round(v*100)/100):"";
    base=c;
  }
  typing=true;fresh=true;save();render();
  const r=document.querySelector('.row[data-c="'+c+'"]');if(r)r.scrollIntoView({block:"nearest"});
}
// hold-and-drag reordering
const LIST=$("list");
let hold=null, drag=null, suppressClick=false, lastTouch=0;
function startPress(row,y){
  cancelPress();
  hold={row,y,timer:setTimeout(()=>lift(row,y),380)};
}
function cancelPress(){if(hold){clearTimeout(hold.timer);hold=null;}}
function lift(row,y){
  hold=null;
  const rows=[...LIST.querySelectorAll(".row")];
  const from=rows.indexOf(row);
  if(from<0)return;
  drag={row,rows,from,to:from,startY:y,y,startScroll:LIST.scrollTop,h:row.offsetHeight,top:row.offsetTop,
        mids:rows.map(r=>r.offsetTop+r.offsetHeight/2)};
  rows.forEach(r=>{if(r!==row)r.classList.add("shift");});
  row.classList.add("lifted");document.body.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  moveDrag();
  drag.raf=requestAnimationFrame(autoScroll);
}
function moveDrag(){
  const d=drag;if(!d)return;
  const dy=d.y-d.startY+(LIST.scrollTop-d.startScroll);
  d.row.style.transform="translateY("+dy+"px) scale(1.03)";
  const centre=d.top+d.h/2+dy;
  let to=0;d.mids.forEach((m,i)=>{if(i!==d.from&&m<centre)to++;});
  d.to=to;
  d.rows.forEach((r,j)=>{
    if(j===d.from)return;
    const t=(d.from<j&&j<=to)?-d.h:(to<=j&&j<d.from)?d.h:0;
    r.style.transform=t?"translateY("+t+"px)":"";
  });
}
function autoScroll(){
  if(!drag)return;
  const b=LIST.getBoundingClientRect();
  const v=drag.y<b.top+60?-7:drag.y>b.bottom-60?7:0;
  if(v){const before=LIST.scrollTop;LIST.scrollTop+=v;if(LIST.scrollTop!==before)moveDrag();}
  drag.raf=requestAnimationFrame(autoScroll);
}
function drop(){
  cancelPress();
  if(!drag)return;
  cancelAnimationFrame(drag.raf);
  const {from,to}=drag;
  drag=null;document.body.classList.remove("dragging");
  if(to!==from){const [c]=list.splice(from,1);list.splice(to,0,c);save();}
  suppressClick=true;setTimeout(()=>{suppressClick=false;},450);
  render();
}
LIST.addEventListener("touchstart",e=>{
  lastTouch=Date.now();
  const row=e.target.closest(".row");
  if(!row||e.target.closest("[data-remove]")||e.touches.length>1){cancelPress();return;}
  startPress(row,e.touches[0].clientY);
},{passive:true});
document.addEventListener("touchmove",e=>{
  lastTouch=Date.now();
  const y=e.touches[0].clientY;
  if(drag){e.preventDefault();drag.y=y;moveDrag();}
  else if(hold&&Math.abs(y-hold.y)>8)cancelPress();
},{passive:false});
document.addEventListener("touchend",()=>{lastTouch=Date.now();drop();});
document.addEventListener("touchcancel",()=>{lastTouch=Date.now();drop();});
LIST.addEventListener("mousedown",e=>{
  if(Date.now()-lastTouch<800||e.button!==0)return;
  const row=e.target.closest(".row");
  if(row&&!e.target.closest("[data-remove]"))startPress(row,e.clientY);
});
document.addEventListener("mousemove",e=>{
  if(Date.now()-lastTouch<800)return;
  if(drag){drag.y=e.clientY;moveDrag();}
  else if(hold&&Math.abs(e.clientY-hold.y)>6)cancelPress();
});
document.addEventListener("mouseup",()=>{if(Date.now()-lastTouch<800)return;drop();});
LIST.addEventListener("contextmenu",e=>{if(e.target.closest(".row"))e.preventDefault();});

$("list").addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();return;}
  const rm=e.target.closest("[data-remove]");
  if(rm){
    if(list.length<=2)return;
    list=list.filter(x=>x!==rm.dataset.remove);
    if(!list.includes(base))base=list[0];
    save();render();return;
  }
  if(e.target.closest("#addBtn")){openSheet();return;}
  const row=e.target.closest(".row");
  if(row&&!editing)selectRow(row.dataset.c);
});
$("list").addEventListener("keydown",e=>{
  const row=e.target.closest(".row");
  if(row&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(!editing)selectRow(row.dataset.c);}
});

function press(k){
  // first key after tapping a currency replaces the old amount
  if(fresh&&k!=="B"&&k!=="C")input="";
  fresh=false;
  if(k==="C")input="";
  else if(k==="B")input=input.slice(0,-1);
  else if(k==="."){if(!input.includes("."))input=(input||"0")+".";}
  else{
    if(input.replace(/[^0-9]/g,"").length>=11)return;
    if(input.includes(".")&&input.split(".")[1].length>=2)return;
    input=(input==="0")?k:input+k;
  }
  save();render();
}
$("pad").addEventListener("click",e=>{const b=e.target.closest(".key");if(b)press(b.dataset.k);});
$("clear").addEventListener("click",()=>press("C"));
$("done").addEventListener("click",()=>{typing=false;render();});
document.addEventListener("keydown",e=>{
  if(!$("sheet").hidden){if(e.key==="Escape")closeSheet();return;}
  if(!typing)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==="."||e.key===",")press(".");
  else if(e.key==="Backspace")press("B");
  else if(e.key==="Escape"||e.key==="Enter"){typing=false;render();}
});

$("flip").addEventListener("click",()=>{inverse=!inverse;save();render();});
$("editBtn").addEventListener("click",()=>{editing=!editing;typing=false;render();});

// add-currency sheet
function openSheet(){
  $("search").value="";buildPicks("");
  $("scrim").hidden=false;$("sheet").hidden=false;$("picks").scrollTop=0;
}
function closeSheet(){$("scrim").hidden=true;$("sheet").hidden=true;}
function buildPicks(q){
  const P=$("picks");P.innerHTML="";
  q=q.trim().toLowerCase();
  const avail=Object.keys(CUR).filter(c=>rates.rates[c]&&!list.includes(c))
    .filter(c=>!q||c.toLowerCase().includes(q)||CUR[c][0].toLowerCase().includes(q))
    .sort((a,b)=>q?((b.toLowerCase().startsWith(q))-(a.toLowerCase().startsWith(q))||a.localeCompare(b)):a.localeCompare(b));
  if(!avail.length){P.append(el("div","empty",q?"No currency matches “"+q+"”. Try a code like USD or a name like dollar.":"Every currency is already on your list."));return;}
  avail.forEach(c=>{
    const b=el("button","pick");b.dataset.c=c;
    b.append(el("span","flag",flagOf(c)),el("span","c",c),el("span","n",CUR[c][0]));
    P.append(b);
  });
}
$("search").addEventListener("input",e=>buildPicks(e.target.value));
$("picks").addEventListener("click",e=>{
  const b=e.target.closest(".pick");if(!b)return;
  list.push(b.dataset.c);save();render();closeSheet();
});
$("closeSheet").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);

render();

// Fresh rates straight from open.er-api.com (free, daily). Last good set is cached on the phone.
const API="https://open.er-api.com/v6/latest/USD";
function takeRates(d){
  if(!d||d.result!=="success"||!d.rates||!d.time_last_update_unix)return;
  const updated=new Date(d.time_last_update_unix*1000).toISOString();
  if(new Date(updated)>new Date(rates.updated)){
    const pick={};Object.keys(CUR).forEach(c=>{if(typeof d.rates[c]==="number")pick[c]=d.rates[c];});
    rates={updated,rates:Object.assign({},rates.rates,pick)};
    store.set("rates",rates);
    if(!drag)render();
  }
}
// Connection light: green when the rates service answers, red when it doesn't or the phone is offline.
function setLink(state){
  const L=$("link");
  L.classList.toggle("live",state==="live");L.classList.toggle("down",state==="down");
  $("linkText").textContent=state==="live"?"Live":state==="down"?"Offline":"Linking";
  L.title=state==="live"?"Connected. Checked "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):
          state==="down"?"No connection. Showing your saved rates.":"Connecting…";
}
let lastFetch=0;
async function check(){
  renderStatus();
  if(document.hidden)return;
  if(!navigator.onLine){setLink("down");return;}
  // the service updates once a day, so ask at most every 30 minutes
  if(lastFetch&&Date.now()-lastFetch<30*60e3){setLink("live");return;}
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(API,{cache:"no-store",signal:ctl.signal});
    if(!r.ok)throw new Error(r.status);
    takeRates(await r.json());lastFetch=Date.now();setLink("live");
  }catch(e){setLink("down");}
  finally{clearTimeout(t);}
}
check();
// re-check every minute while the app is open, and whenever you come back to it
setInterval(check,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)check();});
window.addEventListener("offline",()=>setLink("down"));
window.addEventListener("online",check);
if(!navigator.onLine)setLink("down");
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
